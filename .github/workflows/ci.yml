name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Build, test, and lint each (OS, arch) combination with both the
  # default backend (assembly on x86_64/aarch64) and the
  # `force-fallback` feature (portable Rust). Matrix coverage:
  #
  #   ubuntu-latest    -> x86_64 Linux        (x86_64 asm  + fallback)
  #   macos-latest     -> aarch64 macOS       (aarch64 asm + fallback)
  #   windows-latest   -> x86_64 Windows MSVC (x86_64 asm  + fallback)
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "force-fallback"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ matrix.features }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --release --verbose ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Test (debug)
        run: cargo test --verbose ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Test (release)
        run: cargo test --release --verbose ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features && format('--features {0}', matrix.features) || '' }} -- -D warnings

  # Cross-compile to a non-x86_64/aarch64 target to confirm the
  # fallback path builds on platforms with no assembly backend. We
  # only check (not run) since GitHub-hosted runners don't have these
  # architectures natively.
  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build (lib only — dev-deps may not cross-compile)
        run: cargo build --release --lib --target ${{ matrix.target }} --verbose

  # Verify formatting once on Linux; no need to repeat per-OS.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Verify the crate still builds on its declared MSRV. If this fails,
  # either fix the regression or bump `rust-version` in Cargo.toml.
  msrv:
    name: msrv (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82"
      - name: Build (lib only — dev-deps may require newer toolchain)
        run: cargo build --lib --verbose
      - name: Build (force-fallback)
        run: cargo build --lib --features force-fallback --verbose

  # Doc build with broken-link checking — catches stale intra-doc links
  # when public items move or get renamed.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-latest-cargo-docs-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - run: cargo doc --no-deps --lib --all-features
